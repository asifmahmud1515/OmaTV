# Oma TV in-player zapping keys (loaded via --input-conf).
# UP/DOWN do not register through Lua mp.add_key_binding in current mpv;
# config-file bindings work for all four arrows.
UP    playlist-prev force; show-text ${media-title} 2000
DOWN  playlist-next force; show-text ${media-title} 2000
LEFT  playlist-prev force; show-text ${media-title} 2000
RIGHT playlist-next force; show-text ${media-title} 2000